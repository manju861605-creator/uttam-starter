<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Uttam Starter Control</title>

<!-- MQTT.js -->
<script src="https://cdn.jsdelivr.net/npm/mqtt/dist/mqtt.min.js"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#0f1117;
  color:#ffffff;
}

.container{
  width:100%;
  max-width:600px;
  margin:auto;
  padding:20px;
}

h1{
  text-align:center;
  font-size:32px;
  margin:10px 0 25px;
}

.card{
  background:#191d27;
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 5px 20px rgba(0,0,0,.35);
}

.status-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 0;
  border-bottom:1px solid #303541;
  font-size:18px;
}

.status-row:last-child{
  border-bottom:none;
}

.status{
  font-weight:bold;
}

.online{
  color:#20e070;
}

.offline{
  color:#ff4d4d;
}

.unknown{
  color:#ffc107;
}

button{
  width:100%;
  border:none;
  border-radius:14px;
  padding:20px;
  margin-top:12px;
  font-size:22px;
  font-weight:bold;
  color:white;
  cursor:pointer;
}

button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.start{
  background:#168a43;
}

.stop{
  background:#c62828;
}

.last-action{
  text-align:center;
  font-size:19px;
  padding:8px;
}

.error{
  margin-top:15px;
  color:#ff6b6b;
  font-size:14px;
  text-align:center;
  word-break:break-word;
}

.small{
  text-align:center;
  color:#8e96a8;
  font-size:13px;
  margin-top:15px;
}

</style>

</head>


<body>

<div class="container">


<h1>⚡ Uttam Starter Control</h1>


<!-- STATUS CARD -->

<div class="card">

  <div class="status-row">

    <span>MQTT</span>

    <span id="mqttStatus"
          class="status offline">
      OFFLINE
    </span>

  </div>


  <div class="status-row">

    <span>ESP32</span>

    <span id="espStatus"
          class="status offline">
      OFFLINE
    </span>

  </div>


  <div class="status-row">

    <span>HOTSPOT</span>

    <span id="hotspotStatus"
          class="status unknown">
      UNKNOWN
    </span>

  </div>


  <div class="status-row">

    <span>INTERNET</span>

    <span id="internetStatus"
          class="status unknown">
      UNKNOWN
    </span>

  </div>


  <div class="status-row">

    <span>Wi-Fi Users</span>

    <span id="usersStatus"
          class="status unknown">
      --
    </span>

  </div>

</div>


<!-- CONTROL BUTTONS -->

<div class="card">

  <button
    id="startBtn"
    class="start"
    onclick="sendCommand('START')"
    disabled>

    ▶ START

  </button>


  <button
    id="stopBtn"
    class="stop"
    onclick="sendCommand('STOP')"
    disabled>

    ■ STOP

  </button>

</div>


<!-- LAST ACTION -->

<div class="card">

  <div class="last-action">

    Last Action:
    <strong id="lastAction">
      NONE
    </strong>

  </div>


  <div id="errorMessage"
       class="error">
  </div>

</div>


<div class="small">

  Uttam Automation • MQTT Remote Starter

</div>


</div>


<script>


/* =====================================================
   HIVEMQ CLOUD
   ===================================================== */


/*
   HiveMQ Cloud WebSocket address
*/

const MQTT_HOST =
"wss://3eb57fe59a7e4f279b1dfa7c29dc413b.s1.eu.hivemq.cloud:8884/mqtt";


/*
   HiveMQ username
*/

const MQTT_USER =
"esp32";


/*
   IMPORTANT:
   YAHAN APNA ACTUAL HIVEMQ PASSWORD DALO.

   Example format:
   const MQTT_PASS = "YOUR_PASSWORD";

   Apna real password chat me mat bhejna.
*/

const MQTT_PASS =
"Uttam@861.";


/* =====================================================
   MQTT TOPICS
   ===================================================== */

const COMMAND_TOPIC =
"uttam/starter/command";

const STATUS_TOPIC =
"uttam/starter/status";


/* =====================================================
   VARIABLE
   ===================================================== */

let client = null;


/* =====================================================
   STATUS FUNCTION
   ===================================================== */

function setStatus(id,text,type){

  const element =
    document.getElementById(id);

  if(!element){
    return;
  }

  element.textContent = text;

  element.className =
    "status " + type;

}


/* =====================================================
   ERROR FUNCTION
   ===================================================== */

function setError(text){

  const element =
    document.getElementById("errorMessage");

  if(element){
    element.textContent = text;
  }

}


/* =====================================================
   CLEAR ERROR
   ===================================================== */

function clearError(){

  const element =
    document.getElementById("errorMessage");

  if(element){
    element.textContent = "";
  }

}


/* =====================================================
   ENABLE BUTTONS
   ===================================================== */

function enableButtons(){

  document.getElementById("startBtn").disabled = false;

  document.getElementById("stopBtn").disabled = false;

}


/* =====================================================
   DISABLE BUTTONS
   ===================================================== */

function disableButtons(){

  document.getElementById("startBtn").disabled = true;

  document.getElementById("stopBtn").disabled = true;

}


/* =====================================================
   MQTT CONNECT
   ===================================================== */

function connectMQTT(){

  console.log("Starting MQTT connection...");

  clearError();

  setStatus(
    "mqttStatus",
    "CONNECTING",
    "unknown"
  );


  /* Check MQTT.js */

  if(typeof mqtt === "undefined"){

    setStatus(
      "mqttStatus",
      "ERROR",
      "offline"
    );

    setError(
      "MQTT.js library load nahi hui."
    );

    return;
  }


  /* Generate unique browser client ID */

  const clientId =
    "uttam_web_" +
    Math.random()
      .toString(16)
      .substring(2,10);


  console.log(
    "Client ID:",
    clientId
  );


  console.log(
    "MQTT Host:",
    MQTT_HOST
  );


  /* MQTT connection */

  client = mqtt.connect(
    MQTT_HOST,
    {

      username: MQTT_USER,

      password: MQTT_PASS,

      clientId: clientId,

      clean: true,

      reconnectPeriod: 5000,

      connectTimeout: 15000,

      protocolVersion: 4,

      keepalive: 60

    }
  );


  /* =================================================
     MQTT CONNECTED
     ================================================= */

  client.on(
    "connect",
    function(){

      console.log(
        "MQTT CONNECTED"
      );


      setStatus(
        "mqttStatus",
        "ONLINE",
        "online"
      );


      clearError();


      enableButtons();


      /* Subscribe status topic */

      client.subscribe(
        STATUS_TOPIC,
        {
          qos:0
        },
        function(error){

          if(error){

            console.error(
              "Subscribe error:",
              error
            );

            setError(
              "Subscribe Error: " +
              error.message
            );

          }
          else{

            console.log(
              "Subscribed:",
              STATUS_TOPIC
            );

          }

        }
      );

    }
  );


  /* =================================================
     MQTT MESSAGE
     ================================================= */

  client.on(
    "message",
    function(topic,message){

      const msg =
        message.toString().trim();


      console.log(
        "MQTT MESSAGE:",
        topic,
        msg
      );


      if(topic !== STATUS_TOPIC){
        return;
      }


      /* ---------------------------------------------
         ESP32 ONLINE
         --------------------------------------------- */

      if(msg === "ONLINE"){

        setStatus(
          "espStatus",
          "ONLINE",
          "online"
        );

      }


      /* ---------------------------------------------
         START PRESSED
         --------------------------------------------- */

      else if(
        msg === "START_PRESSED"
      ){

        setStatus(
          "espStatus",
          "ONLINE",
          "online"
        );


        document.getElementById(
          "lastAction"
        ).textContent =
          "START PRESSED";

      }


      /* ---------------------------------------------
         STOP PRESSED
         --------------------------------------------- */

      else if(
        msg === "STOP_PRESSED"
      ){

        setStatus(
          "espStatus",
          "ONLINE",
          "online"
        );


        document.getElementById(
          "lastAction"
        ).textContent =
          "STOP PRESSED";

      }


      /* ---------------------------------------------
         STRUCTURED STATUS
         --------------------------------------------- */

      parseSystemStatus(msg);

    }
  );


  /* =================================================
     MQTT ERROR
     ================================================= */

  client.on(
    "error",
    function(error){

      console.error(
        "MQTT ERROR:",
        error
      );


      setStatus(
        "mqttStatus",
        "OFFLINE",
        "offline"
      );


      disableButtons();


      setError(
        "MQTT Error: " +
        (
          error.message ||
          String(error)
        )
      );

    }
  );


  /* =================================================
     MQTT CLOSE
     ================================================= */

  client.on(
    "close",
    function(){

      console.log(
        "MQTT connection closed"
      );


      setStatus(
        "mqttStatus",
        "OFFLINE",
        "offline"
      );


      disableButtons();

    }
  );


  /* =================================================
     MQTT RECONNECT
     ================================================= */

  client.on(
    "reconnect",
    function(){

      console.log(
        "MQTT reconnecting..."
      );


      setStatus(
        "mqttStatus",
        "CONNECTING",
        "unknown"
      );

    }
  );


  /* =================================================
     MQTT OFFLINE
     ================================================= */

  client.on(
    "offline",
    function(){

      console.log(
        "MQTT offline"
      );


      setStatus(
        "mqttStatus",
        "OFFLINE",
        "offline"
      );


      disableButtons();

    }
  );

}


/* =====================================================
   SYSTEM STATUS PARSER
   ===================================================== */

function parseSystemStatus(msg){


  /*
     Expected future ESP32 message:

     ESP32=ONLINE,
     HOTSPOT=ONLINE,
     USERS=1,
     INTERNET=ONLINE,
     MQTT=ONLINE
  */


  /* ESP32 */

  if(
    msg.includes("ESP32=ONLINE")
  ){

    setStatus(
      "espStatus",
      "ONLINE",
      "online"
    );

  }


  if(
    msg.includes("ESP32=OFFLINE")
  ){

    setStatus(
      "espStatus",
      "OFFLINE",
      "offline"
    );

  }


  /* HOTSPOT */

  if(
    msg.includes("HOTSPOT=ONLINE")
  ){

    setStatus(
      "hotspotStatus",
      "ONLINE",
      "online"
    );

  }


  if(
    msg.includes("HOTSPOT=OFFLINE")
  ){

    setStatus(
      "hotspotStatus",
      "OFFLINE",
      "offline"
    );

  }


  /* INTERNET */

  if(
    msg.includes("INTERNET=ONLINE")
  ){

    setStatus(
      "internetStatus",
      "ONLINE",
      "online"
    );

  }


  if(
    msg.includes("INTERNET=OFFLINE")
  ){

    setStatus(
      "internetStatus",
      "OFFLINE",
      "offline"
    );

  }


  /* USERS */

  const userMatch =
    msg.match(/USERS=(\d+)/);


  if(userMatch){

    document.getElementById(
      "usersStatus"
    ).textContent =
      userMatch[1];


    document.getElementById(
      "usersStatus"
    ).className =
      "status online";

  }

}


/* =====================================================
   SEND START / STOP
   ===================================================== */

function sendCommand(command){


  /* Check client */

  if(!client){

    setError(
      "MQTT client available nahi hai."
    );

    return;

  }


  /* Check connection */

  if(!client.connected){

    setError(
      "MQTT abhi ONLINE nahi hai."
    );

    return;

  }


  console.log(
    "Sending command:",
    command
  );


  /* Publish */

  client.publish(
    COMMAND_TOPIC,
    command,
    {
      qos:0,
      retain:false
    },
    function(error){

      if(error){

        console.error(
          "Publish Error:",
          error
        );


        setError(
          "Command Error: " +
          error.message
        );


        return;

      }


      console.log(
        "Command sent:",
        command
      );


      document.getElementById(
        "lastAction"
      ).textContent =
        command + " SENT";

    }
  );

}


/* =====================================================
   PAGE LOAD
   ===================================================== */

window.addEventListener(
  "load",
  function(){

    console.log(
      "Uttam Starter Control loaded"
    );


    connectMQTT();

  }
);

</script>

</body>
</html>

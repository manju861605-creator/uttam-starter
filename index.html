<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Uttam Starter Control</title>

<script src="https://cdn.jsdelivr.net/npm/mqtt/dist/mqtt.min.js"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#0f1117;
  color:#fff;
}

.container{
  width:100%;
  max-width:600px;
  margin:auto;
  padding:20px;
}

h1{
  text-align:center;
  font-size:32px;
  margin:10px 0 25px;
}

.card{
  background:#191d27;
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 5px 20px rgba(0,0,0,.35);
}

.status-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 0;
  border-bottom:1px solid #303541;
  font-size:18px;
}

.status-row:last-child{
  border-bottom:none;
}

.status{
  font-weight:bold;
}

.online{
  color:#20e070;
}

.offline{
  color:#ff4d4d;
}

.unknown{
  color:#ffc107;
}

button{
  width:100%;
  border:none;
  border-radius:14px;
  padding:20px;
  margin-top:12px;
  font-size:22px;
  font-weight:bold;
  color:#fff;
  cursor:pointer;
}

button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.start{
  background:#168a43;
}

.stop{
  background:#c62828;
}

.last-action{
  text-align:center;
  font-size:19px;
  padding:8px;
}

.error{
  margin-top:15px;
  color:#ff6b6b;
  font-size:14px;
  text-align:center;
  word-break:break-word;
}

.small{
  text-align:center;
  color:#8e96a8;
  font-size:13px;
  margin-top:15px;
}

.info{
  text-align:center;
  color:#8e96a8;
  font-size:12px;
  margin-top:8px;
}

</style>

</head>


<body>

<div class="container">

<h1>⚡ Uttam Starter Control</h1>


<!-- ================= STATUS ================= -->

<div class="card">

  <div class="status-row">
    <span>MQTT</span>

    <span id="mqttStatus"
          class="status offline">
      OFFLINE
    </span>
  </div>


  <div class="status-row">
    <span>ESP32</span>

    <span id="espStatus"
          class="status offline">
      OFFLINE
    </span>
  </div>


  <div class="status-row">
    <span>HOTSPOT</span>

    <span id="hotspotStatus"
          class="status unknown">
      UNKNOWN
    </span>
  </div>


  <div class="status-row">
    <span>INTERNET</span>

    <span id="internetStatus"
          class="status unknown">
      UNKNOWN
    </span>
  </div>


  <div class="status-row">
    <span>Wi-Fi Users</span>

    <span id="usersStatus"
          class="status unknown">
      --
    </span>
  </div>

</div>


<!-- ================= CONTROL ================= -->

<div class="card">

  <button
    id="startBtn"
    class="start"
    onclick="sendCommand('START')"
    disabled>

    ▶ START

  </button>


  <button
    id="stopBtn"
    class="stop"
    onclick="sendCommand('STOP')"
    disabled>

    ■ STOP

  </button>

</div>


<!-- ================= LAST ACTION ================= -->

<div class="card">

  <div class="last-action">

    Last Action:
    <strong id="lastAction">
      NONE
    </strong>

  </div>


  <div id="errorMessage"
       class="error">
  </div>

</div>


<div class="small">

  Uttam Automation • MQTT Remote Starter

</div>


<div class="info">

  EMQX Cloud • Secure WebSocket

</div>

</div>


<script>


/* =====================================================
   EMQX CLOUD
   ===================================================== */


/*
   EMQX Serverless WebSocket TLS
*/

const MQTT_HOST =
"wss://e21427ed.ala.eu-central-1.emqxsl.com:8084/mqtt";


/*
   WEB CONTROL USER

   EMQX Authentication me jo user banaya hai:
   webcontrol
*/

const MQTT_USER =
"webcontrol";


/*
   YAHAN webcontrol KA PASSWORD DALO

   Example:

   const MQTT_PASS = "YourWebPassword";

   IMPORTANT:
   ESP32 wala password yahan mat lagana.
*/

const MQTT_PASS =
"YOUR_WEBCONTROL_PASSWORD";


/* =====================================================
   MQTT TOPICS
   ===================================================== */

const COMMAND_TOPIC =
"uttam/starter/command";

const STATUS_TOPIC =
"uttam/starter/status";


/* =====================================================
   VARIABLES
   ===================================================== */

let client = null;

let lastStatusTime = 0;


/* =====================================================
   STATUS FUNCTION
   ===================================================== */

function setStatus(id,text,type){

  const element =
    document.getElementById(id);

  if(!element){
    return;
  }

  element.textContent = text;

  element.className =
    "status " + type;

}


/* =====================================================
   ERROR
   ===================================================== */

function setError(text){

  const element =
    document.getElementById("errorMessage");

  if(element){
    element.textContent = text;
  }

}


/* =====================================================
   CLEAR ERROR
   ===================================================== */

function clearError(){

  const element =
    document.getElementById("errorMessage");

  if(element){
    element.textContent = "";
  }

}


/* =====================================================
   ENABLE BUTTONS
   ===================================================== */

function enableButtons(){

  document.getElementById("startBtn").disabled =
    false;

  document.getElementById("stopBtn").disabled =
    false;

}


/* =====================================================
   DISABLE BUTTONS
   ===================================================== */

function disableButtons(){

  document.getElementById("startBtn").disabled =
    true;

  document.getElementById("stopBtn").disabled =
    true;

}


/* =====================================================
   MQTT CONNECT
   ===================================================== */

function connectMQTT(){

  console.log("Connecting to EMQX...");

  clearError();

  setStatus(
    "mqttStatus",
    "CONNECTING",
    "unknown"
  );


  /* MQTT.js check */

  if(typeof mqtt === "undefined"){

    setStatus(
      "mqttStatus",
      "ERROR",
      "offline"
    );

    setError(
      "MQTT.js load nahi hui."
    );

    return;
  }


  /* Unique browser client ID */

  const clientId =
    "uttam_web_" +
    Math.random()
      .toString(16)
      .substring(2,10);


  console.log(
    "Client ID:",
    clientId
  );


  console.log(
    "Connecting:",
    MQTT_HOST
  );


  /* =================================================
     MQTT CONNECT
     ================================================= */

  client = mqtt.connect(
    MQTT_HOST,
    {

      username:
        MQTT_USER,

      password:
        MQTT_PASS,

      clientId:
        clientId,

      clean:
        true,

      reconnectPeriod:
        5000,

      connectTimeout:
        15000,

      keepalive:
        60,

      protocolVersion:
        4

    }
  );


  /* =================================================
     CONNECTED
     ================================================= */

  client.on(
    "connect",
    function(){

      console.log(
        "EMQX CONNECTED"
      );


      setStatus(
        "mqttStatus",
        "ONLINE",
        "online"
      );


      clearError();


      enableButtons();


      /* Subscribe ESP32 status */

      client.subscribe(
        STATUS_TOPIC,
        {
          qos:0
        },
        function(error){

          if(error){

            console.error(
              "Subscribe error:",
              error
            );

            setError(
              "Subscribe Error: " +
              error.message
            );

            return;
          }


          console.log(
            "Subscribed:",
            STATUS_TOPIC
          );

        }
      );

    }
  );


  /* =================================================
     MQTT MESSAGE
     ================================================= */

  client.on(
    "message",
    function(topic,message){

      const msg =
        message.toString().trim();


      console.log(
        "MQTT MESSAGE:",
        topic,
        msg
      );


      if(topic !== STATUS_TOPIC){
        return;
      }


      /* Status received */

      lastStatusTime =
        Date.now();


      /* Parse complete ESP32 status */

      parseSystemStatus(msg);


      /* START */

      if(
        msg === "START_PRESSED"
      ){

        setStatus(
          "espStatus",
          "ONLINE",
          "online"
        );

        document.getElementById(
          "lastAction"
        ).textContent =
          "START PRESSED";

      }


      /* STOP */

      if(
        msg === "STOP_PRESSED"
      ){

        setStatus(
          "espStatus",
          "ONLINE",
          "online"
        );

        document.getElementById(
          "lastAction"
        ).textContent =
          "STOP PRESSED";

      }


      /* START RELEASED */

      if(
        msg === "START_RELEASED"
      ){

        document.getElementById(
          "lastAction"
        ).textContent =
          "START RELEASED";

      }


      /* STOP RELEASED */

      if(
        msg === "STOP_RELEASED"
      ){

        document.getElementById(
          "lastAction"
        ).textContent =
          "STOP RELEASED";

      }

    }
  );


  /* =================================================
     ERROR
     ================================================= */

  client.on(
    "error",
    function(error){

      console.error(
        "MQTT ERROR:",
        error
      );


      setStatus(
        "mqttStatus",
        "OFFLINE",
        "offline"
      );


      disableButtons();


      setError(
        "MQTT Error: " +
        (
          error.message ||
          String(error)
        )
      );

    }
  );


  /* =================================================
     CLOSE
     ================================================= */

  client.on(
    "close",
    function(){

      console.log(
        "MQTT connection closed"
      );


      setStatus(
        "mqttStatus",
        "OFFLINE",
        "offline"
      );


      disableButtons();

    }
  );


  /* =================================================
     RECONNECT
     ================================================= */

  client.on(
    "reconnect",
    function(){

      console.log(
        "Reconnecting..."
      );


      setStatus(
        "mqttStatus",
        "CONNECTING",
        "unknown"
      );

    }
  );


  /* =================================================
     OFFLINE
     ================================================= */

  client.on(
    "offline",
    function(){

      console.log(
        "MQTT offline"
      );


      setStatus(
        "mqttStatus",
        "OFFLINE",
        "offline"
      );


      disableButtons();

    }
  );

}


/* =====================================================
   SYSTEM STATUS PARSER
   ===================================================== */

function parseSystemStatus(msg){

  console.log(
    "Parsing status:",
    msg
  );


  /*
     ESP32 firmware message example:

     FIRMWARE=V4.1-EMQX-OTA,
     ESP32=ONLINE,
     HOTSPOT=ONLINE,
     USERS=1,
     INTERNET=ONLINE,
     IP=192.168.x.x,
     NAT=ONLINE,
     DNS=ONLINE
  */


  /* =================================================
     ESP32
     ================================================= */

  if(
    msg.includes("ESP32=ONLINE")
  ){

    setStatus(
      "espStatus",
      "ONLINE",
      "online"
    );

  }


  if(
    msg.includes("ESP32=OFFLINE")
  ){

    setStatus(
      "espStatus",
      "OFFLINE",
      "offline"
    );

  }


  /* =================================================
     HOTSPOT
     ================================================= */

  if(
    msg.includes("HOTSPOT=ONLINE")
  ){

    setStatus(
      "hotspotStatus",
      "ONLINE",
      "online"
    );

  }


  if(
    msg.includes("HOTSPOT=OFFLINE")
  ){

    setStatus(
      "hotspotStatus",
      "OFFLINE",
      "offline"
    );

  }


  /* =================================================
     INTERNET
     ================================================= */

  if(
    msg.includes("INTERNET=ONLINE")
  ){

    setStatus(
      "internetStatus",
      "ONLINE",
      "online"
    );

  }


  if(
    msg.includes("INTERNET=OFFLINE")
  ){

    setStatus(
      "internetStatus",
      "OFFLINE",
      "offline"
    );

  }


  /* =================================================
     USERS
     ================================================= */

  const userMatch =
    msg.match(/USERS=(\d+)/);


  if(userMatch){

    const users =
      document.getElementById(
        "usersStatus"
      );

    users.textContent =
      userMatch[1];

    users.className =
      "status online";

  }

}


/* =====================================================
   SEND COMMAND
   ===================================================== */

function sendCommand(command){

  clearError();


  /* Client check */

  if(!client){

    setError(
      "MQTT client available nahi hai."
    );

    return;

  }


  /* Connection check */

  if(!client.connected){

    setError(
      "MQTT abhi ONLINE nahi hai."
    );

    return;

  }


  console.log(
    "Sending:",
    command
  );


  /* Publish command */

  client.publish(
    COMMAND_TOPIC,
    command,
    {
      qos:0,
      retain:false
    },
    function(error){

      if(error){

        console.error(
          "Publish Error:",
          error
        );


        setError(
          "Command Error: " +
          error.message
        );


        return;

      }


      console.log(
        "Command sent:",
        command
      );


      document.getElementById(
        "lastAction"
      ).textContent =
        command + " SENT";

    }
  );

}


/* =====================================================
   STATUS WATCHDOG
   ===================================================== */

/*
   Agar ESP32 se 90 second tak status nahi aaya,
   to website ESP32 ko OFFLINE dikhayegi.
*/

setInterval(
  function(){

    if(
      lastStatusTime === 0
    ){
      return;
    }


    const elapsed =
      Date.now() -
      lastStatusTime;


    if(
      elapsed > 90000
    ){

      setStatus(
        "espStatus",
        "OFFLINE",
        "offline"
      );


      setStatus(
        "hotspotStatus",
        "UNKNOWN",
        "unknown"
      );


      setStatus(
        "internetStatus",
        "UNKNOWN",
        "unknown"
      );


      document.getElementById(
        "usersStatus"
      ).textContent =
        "--";


      document.getElementById(
        "usersStatus"
      ).className =
        "status unknown";

    }

  },
  10000
);


/* =====================================================
   PAGE LOAD
   ===================================================== */

window.addEventListener(
  "load",
  function(){

    console.log(
      "Uttam Starter Control loaded"
    );


    connectMQTT();

  }
);

</script>

</body>
      </html>

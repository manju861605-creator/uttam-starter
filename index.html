<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Uttam Starter Control</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0f1117;
  color:white;
}

.container{
  max-width:600px;
  margin:auto;
  padding:20px;
}

h1{
  text-align:center;
  margin-bottom:25px;
}

.card{
  background:#191d27;
  border-radius:16px;
  padding:20px;
  margin-bottom:15px;
  box-shadow:0 5px 20px rgba(0,0,0,.3);
}

.status-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 0;
  border-bottom:1px solid #303541;
}

.status-row:last-child{
  border-bottom:none;
}

.status{
  font-weight:bold;
}

.online{
  color:#20e070;
}

.offline{
  color:#ff4d4d;
}

.unknown{
  color:#ffc107;
}

button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:18px;
  margin-top:12px;
  font-size:20px;
  font-weight:bold;
  color:white;
  cursor:pointer;
}

.start{
  background:#168a43;
}

.stop{
  background:#c62828;
}

button:disabled{
  opacity:.45;
}

.last-action{
  text-align:center;
  font-size:18px;
  padding:10px;
}

.error{
  color:#ff6b6b;
  font-size:14px;
  word-break:break-word;
  margin-top:10px;
}

.small{
  text-align:center;
  color:#8e96a8;
  font-size:13px;
  margin-top:15px;
}
</style>
</head>

<body>

<div class="container">

<h1>⚡ Uttam Starter Control</h1>

<div class="card">

  <div class="status-row">
    <span>MQTT</span>
    <span id="mqttStatus" class="status offline">OFFLINE</span>
  </div>

  <div class="status-row">
    <span>ESP32</span>
    <span id="espStatus" class="status offline">OFFLINE</span>
  </div>

  <div class="status-row">
    <span>HOTSPOT</span>
    <span id="hotspotStatus" class="status unknown">UNKNOWN</span>
  </div>

  <div class="status-row">
    <span>INTERNET</span>
    <span id="internetStatus" class="status unknown">UNKNOWN</span>
  </div>

  <div class="status-row">
    <span>Wi-Fi Users</span>
    <span id="usersStatus" class="status unknown">--</span>
  </div>

</div>


<div class="card">

  <button
    id="startBtn"
    class="start"
    onclick="sendCommand('START')"
    disabled>
    ▶ START
  </button>

  <button
    id="stopBtn"
    class="stop"
    onclick="sendCommand('STOP')"
    disabled>
    ■ STOP
  </button>

</div>


<div class="card">

  <div class="last-action">
    Last Action:
    <strong id="lastAction">NONE</strong>
  </div>

  <div id="errorMessage" class="error"></div>

</div>

<div class="small">
  Uttam Automation • MQTT Remote Starter
</div>

</div>


<script>

/* ==============================
   HIVEMQ SETTINGS
   ============================== */

const MQTT_HOST =
"wss://3eb57fe59a7e4f279b1dfa7c29dc413b.s1.eu.hivemq.cloud:8884/mqtt";

const MQTT_USER =
"esp32";

/*
   IMPORTANT:
   Yahan apna HiveMQ password paste karo.
   Password ko chat me mat bhejna.
*/
const MQTT_PASS =
Uttam@861.";


/* ==============================
   MQTT TOPICS
   ============================== */

const COMMAND_TOPIC =
"uttam/starter/command";

const STATUS_TOPIC =
"uttam/starter/status";


/* ==============================
   VARIABLES
   ============================== */

let client = null;


/* ==============================
   UI FUNCTIONS
   ============================== */

function setStatus(id, text, type){

  const element = document.getElementById(id);

  element.textContent = text;

  element.className = "status " + type;
}


function setError(text){

  document.getElementById("errorMessage").textContent = text;

}


function clearError(){

  document.getElementById("errorMessage").textContent = "";

}


/* ==============================
   MQTT CONNECT
   ============================== */

function connectMQTT(){

  clearError();

  const clientId =
    "webpanel_" +
    Math.random().toString(16).substring(2,10);

  console.log("Connecting to HiveMQ...");
  console.log("Client ID:", clientId);

  client = mqtt.connect(MQTT_HOST, {

    username: MQTT_USER,

    password: MQTT_PASS,

    clientId: clientId,

    clean: true,

    reconnectPeriod: 5000,

    connectTimeout: 15000,

    protocolVersion: 4,

    keepalive: 60

  });


  /* CONNECTED */

  client.on("connect", function(){

    console.log("MQTT CONNECTED");

    setStatus(
      "mqttStatus",
      "ONLINE",
      "online"
    );

    clearError();

    document.getElementById("startBtn").disabled = false;

    document.getElementById("stopBtn").disabled = false;


    /* Subscribe to ESP32 status */

    client.subscribe(
      STATUS_TOPIC,
      {qos:0},
      function(err){

        if(err){

          console.error("Subscribe error:", err);

          setError(
            "Subscribe Error: " +
            err.message
          );

          return;
        }

        console.log(
          "Subscribed:",
          STATUS_TOPIC
        );

      }
    );

  });


  /* MESSAGE RECEIVED */

  client.on("message", function(topic, message){

    const msg =
      message.toString().trim();

    console.log(
      "MQTT MESSAGE:",
      topic,
      msg
    );


    if(topic !== STATUS_TOPIC){

      return;

    }


    /* ==========================
       SIMPLE ESP32 STATUS
       ========================== */

    if(msg === "ONLINE"){

      setStatus(
        "espStatus",
        "ONLINE",
        "online"
      );

    }


    /* ==========================
       START
       ========================== */

    else if(msg === "START_PRESSED"){

      setStatus(
        "espStatus",
        "ONLINE",
        "online"
      );

      document.getElementById(
        "lastAction"
      ).textContent = "START PRESSED";

    }


    /* ==========================
       STOP
       ========================== */

    else if(msg === "STOP_PRESSED"){

      setStatus(
        "espStatus",
        "ONLINE",
        "online"
      );

      document.getElementById(
        "lastAction"
      ).textContent = "STOP PRESSED";

    }


    /* ==========================
       STRUCTURED STATUS
       ========================== */

    parseSystemStatus(msg);

  });


  /* ERROR */

  client.on("error", function(err){

    console.error(
      "MQTT ERROR:",
      err
    );

    setStatus(
      "mqttStatus",
      "OFFLINE",
      "offline"
    );

    setError(
      "MQTT Error: " +
      (err.message || String(err))
    );

  });


  /* CLOSE */

  client.on("close", function(){

    console.log("MQTT connection closed");

    setStatus(
      "mqttStatus",
      "OFFLINE",
      "offline"
    );

    document.getElementById("startBtn").disabled = true;

    document.getElementById("stopBtn").disabled = true;

  });


  /* RECONNECT */

  client.on("reconnect", function(){

    console.log("MQTT reconnecting...");

    setStatus(
      "mqttStatus",
      "CONNECTING",
      "unknown"
    );

  });


  /* OFFLINE */

  client.on("offline", function(){

    console.log("MQTT offline");

    setStatus(
      "mqttStatus",
      "OFFLINE",
      "offline"
    );

  });

}


/* ==============================
   SYSTEM STATUS PARSER
   ============================== */

function parseSystemStatus(msg){

  /*
    Example expected message:

    ESP32=ONLINE,
    HOTSPOT=ONLINE,
    USERS=1,
    INTERNET=ONLINE,
    MQTT=ONLINE
  */

  if(msg.indexOf("ESP32=ONLINE") !== -1){

    setStatus(
      "espStatus",
      "ONLINE",
      "online"
    );

  }


  if(msg.indexOf("ESP32=OFFLINE") !== -1){

    setStatus(
      "espStatus",
      "OFFLINE",
      "offline"
    );

  }


  if(msg.indexOf("HOTSPOT=ONLINE") !== -1){

    setStatus(
      "hotspotStatus",
      "ONLINE",
      "online"
    );

  }


  if(msg.indexOf("HOTSPOT=OFFLINE") !== -1){

    setStatus(
      "hotspotStatus",
      "OFFLINE",
      "offline"
    );

  }


  if(msg.indexOf("INTERNET=ONLINE") !== -1){

    setStatus(
      "internetStatus",
      "ONLINE",
      "online"
    );

  }


  if(msg.indexOf("INTERNET=OFFLINE") !== -1){

    setStatus(
      "internetStatus",
      "OFFLINE",
      "offline"
    );

  }


  const userMatch =
    msg.match(/USERS=(\d+)/);

  if(userMatch){

    document.getElementById(
      "usersStatus"
    ).textContent = userMatch[1];

    document.getElementById(
      "usersStatus"
    ).className = "status online";

  }

}


/* ==============================
   SEND START / STOP
   ============================== */

function sendCommand(command){

  if(!client){

    alert("MQTT connected nahi hai.");

    return;

  }


  if(!client.connected){

    alert("MQTT offline hai.");

    return;

  }


  console.log(
    "Sending:",
    command
  );


  client.publish(
    COMMAND_TOPIC,
    command,
    {
      qos:0,
      retain:false
    },
    function(err){

      if(err){

        console.error(
          "Publish error:",
          err
        );

        setError(
          "Command Error: " +
          err.message
        );

        return;

      }


      console.log(
        "Command sent:",
        command
      );

      document.getElementById(
        "lastAction"
      ).textContent =
        command + " SENT";

    }
  );

}


/* ==============================
   START PAGE
   ============================== */

window.addEventListener(
  "load",
  function(){

    connectMQTT();

  }
);

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Uttam Starter Control</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
}

.container {
    width: 100%;
    max-width: 500px;
    margin: auto;
    padding: 20px;
}

.header {
    text-align: center;
    margin-bottom: 20px;
}

.header h1 {
    margin: 0;
    font-size: 30px;
}

.header p {
    margin-top: 8px;
    color: #94a3b8;
}

.card {
    background: #1e293b;
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.25);
}

.card-title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 15px;
}

.status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 0;
    border-bottom: 1px solid #334155;
    font-size: 17px;
}

.status-row:last-child {
    border-bottom: none;
}

.status-online {
    color: #22c55e;
    font-weight: bold;
}

.status-offline {
    color: #ef4444;
    font-weight: bold;
}

.status-wait {
    color: #f59e0b;
    font-weight: bold;
}

.dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-right: 7px;
}

.green {
    background: #22c55e;
}

.red {
    background: #ef4444;
}

.yellow {
    background: #f59e0b;
}

.buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

button {
    border: none;
    color: white;
    border-radius: 16px;
    padding: 25px 10px;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.15s;
}

button:active {
    transform: scale(0.95);
}

.start-button {
    background: #16a34a;
}

.stop-button {
    background: #dc2626;
}

button:disabled {
    background: #475569;
    cursor: not-allowed;
}

.connection-box {
    text-align: center;
    padding: 12px;
    background: #0f172a;
    border-radius: 12px;
    margin-bottom: 15px;
    font-size: 18px;
    font-weight: bold;
}

.last-action {
    text-align: center;
    font-size: 18px;
}

.last-action-value {
    margin-top: 10px;
    font-size: 22px;
    font-weight: bold;
}

.users-number {
    font-size: 22px;
    font-weight: bold;
}

.footer {
    text-align: center;
    color: #64748b;
    font-size: 13px;
    margin-top: 20px;
}

</style>

</head>


<body>

<div class="container">


<!-- ========================================= -->
<!-- HEADER -->
<!-- ========================================= -->

<div class="header">

<h1>⚡ UTTAM STARTER</h1>

<p>Remote Control Panel</p>

</div>


<!-- ========================================= -->
<!-- SYSTEM STATUS -->
<!-- ========================================= -->

<div class="card">

<div class="card-title">
System Status
</div>


<!-- MQTT -->

<div class="connection-box">

MQTT :

<span id="mqttStatus"
      class="status-offline">

<span class="dot red"></span>
OFFLINE

</span>

</div>


<!-- ESP32 -->

<div class="status-row">

<span>
ESP32
</span>

<span id="espStatus"
      class="status-offline">

<span class="dot red"></span>
OFFLINE

</span>

</div>


<!-- HOTSPOT -->

<div class="status-row">

<span>
HOTSPOT
</span>

<span id="hotspotStatus"
      class="status-offline">

<span class="dot red"></span>
OFFLINE

</span>

</div>


<!-- INTERNET -->

<div class="status-row">

<span>
INTERNET
</span>

<span id="internetStatus"
      class="status-offline">

<span class="dot red"></span>
OFFLINE

</span>

</div>


<!-- WIFI USERS -->

<div class="status-row">

<span>
Wi-Fi Users
</span>

<span id="wifiUsers"
      class="users-number">

0

</span>

</div>


</div>


<!-- ========================================= -->
<!-- START STOP -->
<!-- ========================================= -->

<div class="card">

<div class="card-title">
Starter Control
</div>


<div class="buttons">


<button
id="startButton"
class="start-button"
onclick="sendCommand('START')">

▶ START

</button>


<button
id="stopButton"
class="stop-button"
onclick="sendCommand('STOP')">

■ STOP

</button>


</div>

</div>


<!-- ========================================= -->
<!-- LAST ACTION -->
<!-- ========================================= -->

<div class="card">

<div class="last-action">

Last Action

<div id="lastAction"
     class="last-action-value">

WAITING

</div>

</div>

</div>


<div class="footer">

ESP32 + W5500 + HiveMQ

</div>


</div>
